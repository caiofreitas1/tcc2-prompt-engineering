<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt em Código</title>
<meta name="description" content="Um guia para consultar o que os estudos mediram sobre engenharia de prompt para geração, depuração, tradução e refatoração de código.">
<script>
// Aplica o tema antes da primeira pintura. Só a preferência de tema é guardada.
(function () {
  var p = 'sistema';
  try { p = localStorage.getItem('tema') || 'sistema'; } catch (e) {}
  var escuro = p === 'escuro' || (p !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-tema', escuro ? 'escuro' : 'claro');
})();
</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="estilo.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="pular" href="#/guia" id="pular">Pular para o conteúdo</a>
<header class="topo">
  <div class="topo-linha">
    <a class="marca" href="#/guia">Prompt em Código</a>
    <label class="tema" for="tema">Tema
      <select id="tema">
        <option value="sistema">Sistema</option>
        <option value="claro">Claro</option>
        <option value="escuro">Escuro</option>
      </select>
    </label>
    <nav class="principal" aria-label="Principal">
      <a href="#/guia" data-nav="guia">Guia</a>
      <a href="#/explorador" data-nav="explorador">Explorador</a>
      <a href="#/sobre" data-nav="sobre">Sobre</a>
    </nav>
  </div>
  <p class="procedencia"><span id="procedencia">Extração por IA, conferida pelo autor por amostra.</span>
    <a href="#/sobre?sec=conferencia">Entender a conferência</a></p>
</header>
<main id="conteudo" tabindex="-1">
  <p role="status">Carregando os dados da revisão…</p>
  <noscript><p>Este site precisa de JavaScript para consultar os dados da revisão.</p></noscript>
</main>
<footer class="rodape">
  <p id="rodape-versao">Prompt em Código</p>
  <p><a href="#/sobre?sec=como-ler">Como ler</a> · <a href="#/sobre?sec=versao">Versão e documentos</a></p>
</footer>
</body>
</html>
